services:
  cv:
    build: .
    image: landpage:latest
    container_name: landpage
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Router configuration
      - "traefik.http.routers.cv.rule=Host(`devapis.cloud`) && PathPrefix(`/cv`)"
      - "traefik.http.routers.cv.entrypoints=https"
      - "traefik.http.routers.cv.tls=true"
      - "traefik.http.routers.cv.tls.certresolver=resolver"
      # Middleware: remove /cv prefix before sending to nginx
      - "traefik.http.middlewares.cv-stripprefix.stripprefix.prefixes=/cv"
      - "traefik.http.routers.cv.middlewares=cv-stripprefix@docker"
      # Service binding
      - "traefik.http.routers.cv.service=cv"
      - "traefik.http.services.cv.loadbalancer.server.port=80"
    volumes:
      - ./src:/usr/share/nginx/html:ro,z
    networks:
      - server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend de Analytics
  analytics-api:
    build: ./backend
    image: cv-analytics:latest
    container_name: cv-analytics
    restart: unless-stopped
    environment:
      # Sin valores por defecto a propósito. Un `DB_HOST` con valor por defecto
      # apuntó durante meses a un contenedor inexistente y el servicio se pasó
      # ese tiempo en bucle de reinicio con `gaierror: name resolution`.
      # Es preferible que `docker compose up` falle a que arranque adivinando.
      - DB_HOST=${DB_HOST:?DB_HOST es obligatoria, define el nombre del contenedor de PostgreSQL en .env}
      - DB_NAME=${DB_NAME:?DB_NAME es obligatoria, defínela en .env}
      - DB_USER=${DB_USER:?DB_USER es obligatoria, defínela en .env}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD es obligatoria, defínela en .env}
      - DB_PORT=${DB_PORT:-5432}
      # Credenciales del dashboard y de la API de consulta.
      - ANALYTICS_USER=${ANALYTICS_USER:?ANALYTICS_USER es obligatoria, defínela en .env}
      - ANALYTICS_PASSWORD=${ANALYTICS_PASSWORD:?ANALYTICS_PASSWORD es obligatoria, defínela en .env}
      # Sal para el hash de IPs. Si cambia, se pierde la continuidad del
      # conteo de visitantes únicos.
      - ANALYTICS_IP_SALT=${ANALYTICS_IP_SALT:?ANALYTICS_IP_SALT es obligatoria, defínela en .env}
    labels:
      - "traefik.enable=true"

      # ------------------------------------------------------------------
      # Router público: solo el endpoint de tracking y el health check.
      #
      # Sobre las prioridades: el panel de Traefik publica su propio router
      # `Host(devapis.cloud) && (PathPrefix(/api) || PathPrefix(/dashboard))`
      # con su middleware basicauth. Traefik v2 asigna prioridad por longitud
      # de regla, así que ese router vale 73 y se queda con todo `/api/*` que
      # no gane explícitamente. Ambos routers de aquí deben superar ese 73,
      # o el tracking y las estadísticas acaban contra el panel de Traefik
      # devolviendo `401 realm="traefik"`.
      # ------------------------------------------------------------------
      - "traefik.http.routers.analytics-public.rule=Host(`devapis.cloud`) && (Path(`/api/track`) || Path(`/health`))"
      - "traefik.http.routers.analytics-public.priority=100"
      - "traefik.http.routers.analytics-public.entrypoints=https"
      - "traefik.http.routers.analytics-public.tls=true"
      - "traefik.http.routers.analytics-public.tls.certresolver=resolver"
      - "traefik.http.routers.analytics-public.service=analytics"
      # Rate limiting: el tracking es escritura no autenticada en la BD.
      - "traefik.http.middlewares.analytics-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.analytics-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.analytics-ratelimit.ratelimit.period=1m"
      - "traefik.http.routers.analytics-public.middlewares=analytics-ratelimit@docker"

      # ------------------------------------------------------------------
      # Router privado: estadísticas y dashboard.
      # La autenticación real vive en la aplicación (backend/main.py), de
      # modo que la protección viaja con el repositorio y no depende del
      # reverse proxy.
      # ------------------------------------------------------------------
      - "traefik.http.routers.analytics-private.rule=Host(`devapis.cloud`) && (PathPrefix(`/api/analytics`) || PathPrefix(`/analytics`))"
      # 90: por encima del 73 del panel de Traefik, por debajo del router
      # público para que `/api/track` nunca caiga aquí.
      - "traefik.http.routers.analytics-private.priority=90"
      - "traefik.http.routers.analytics-private.entrypoints=https"
      - "traefik.http.routers.analytics-private.tls=true"
      - "traefik.http.routers.analytics-private.tls.certresolver=resolver"
      - "traefik.http.routers.analytics-private.service=analytics"

      # Service binding compartido por ambos routers
      - "traefik.http.services.analytics.loadbalancer.server.port=8000"
    networks:
      # `server` lo comparte con Traefik; `db-internal`, con PostgreSQL.
      # El contenedor de la base no está en `server` a propósito, así que sin
      # esta segunda red el servicio no resuelve `DB_HOST`.
      - server
      - db-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  # Ambas deben existir antes de levantar el stack:
  #   docker network create server
  # `db-internal` la crea el proyecto que gestiona PostgreSQL.
  server:
    external: true
  db-internal:
    external: true
