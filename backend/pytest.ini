[pytest]
testpaths = tests

# `auto`: los tests async no necesitan decorador propio. Sin esto, pytest los
# recoge y los da por pasados sin ejecutarlos, que es la peor forma de fallar.
asyncio_mode = auto

# Explícito para no heredar el cambio de default anunciado por pytest-asyncio:
# un bucle por test, sin estado compartido entre ellos.
asyncio_default_fixture_loop_scope = function

addopts = -q --strict-markers
