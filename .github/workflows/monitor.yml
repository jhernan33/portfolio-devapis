name: Monitor

# Vigilancia de producción entre despliegues.
#
# El despliegue comprueba una vez, justo después de recrear los contenedores, y
# ahí se acaba. Este proyecto ya estuvo meses con el backend en bucle de
# reinicio sin que nadie lo viera: el frontend se traga los errores de tracking
# por diseño, así que un backend caído no se nota desde fuera.
#
# Cada media hora ejecuta las mismas comprobaciones que el despliegue y, si
# fallan, abre un issue. Si ya hay uno abierto, comenta en él en lugar de crear
# otro: veinte issues idénticos son ruido y el ruido se ignora.
#
# Complemento recomendado: un chequeo externo de /health en healthchecks.io o
# similar. Si lo que está caído es GitHub Actions, esto tampoco avisa.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-produccion
  cancel-in-progress: true

jobs:
  comprobar:
    name: Comprobar producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verificar
        id: verificar
        run: |
          if salida=$(./tools/verificar-produccion.sh 2>&1); then
            echo "estado=bien" >> "$GITHUB_OUTPUT"
          else
            echo "estado=mal" >> "$GITHUB_OUTPUT"
          fi
          echo "$salida"
          {
            echo 'detalle<<FIN'
            echo "$salida"
            echo FIN
          } >> "$GITHUB_OUTPUT"

      - name: Abrir o actualizar el aviso
        if: steps.verificar.outputs.estado == 'mal'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const ETIQUETA = 'produccion-caida';
            const detalle = process.env.DETALLE;
            const cuerpo = [
              '`tools/verificar-produccion.sh` ha fallado.',
              '',
              '```',
              detalle,
              '```',
              '',
              `Comprobado: ${new Date().toISOString()}`,
              `[Ejecución](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ETIQUETA,
            });

            if (abiertos.data.length > 0) {
              // Ya hay aviso: se comenta en él. Un issue nuevo cada media hora
              // convertiría la alerta en ruido, y el ruido se ignora.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: abiertos.data[0].number,
                body: cuerpo,
              });
              core.notice(`Sigue caído; comentado en el issue #${abiertos.data[0].number}`);
              return;
            }

            const creado = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Producción no responde correctamente',
              body: cuerpo,
              labels: [ETIQUETA],
            });
            core.notice(`Abierto el issue #${creado.data.number}`);
        env:
          DETALLE: ${{ steps.verificar.outputs.detalle }}

      - name: Cerrar el aviso si ya está resuelto
        if: steps.verificar.outputs.estado == 'bien'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const ETIQUETA = 'produccion-caida';
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ETIQUETA,
            });
            for (const issue of abiertos.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Producción vuelve a responder correctamente. Se cierra solo.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.notice(`Cerrado el issue #${issue.number}`);
            }

      - name: Fallar si producción está caída
        if: steps.verificar.outputs.estado == 'mal'
        run: exit 1
