name: CI

# Cada comprobación de aquí corresponde a un fallo que este repositorio ya
# tuvo. No son buenas prácticas genéricas: son regresiones concretas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guardas:
    name: Guardas de regresión
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # src/ es público: Nginx sirve TODO lo que hay dentro. Tres copias
      # -old.* estuvieron descargables en /cv/index-old.html.
      - name: Ningún fichero -old.* en src/
        run: |
          if find src -name '*-old.*' -print | grep -q .; then
            echo "::error::Hay copias -old.* en src/, que Nginx publica. Muévelas a .backups/"
            find src -name '*-old.*'
            exit 1
          fi

      # .env lleva la contraseña de la base y la sal de las IPs.
      - name: .env no versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env está versionado"
            exit 1
          fi

      # El teléfono se retiró a propósito del repositorio (es público).
      - name: Sin datos personales de contacto directo
        run: |
          # .backups y node_modules están en .gitignore y no llegan a CI, pero
          # sí existen en local: sin excluirlos, esta guarda da un falso
          # positivo a quien la ejecute en su máquina y deja de creerse.
          if grep -rIEn '\+?58[ -]?414[ -]?750[ -]?5247|4147505247' . \
               --exclude-dir=.git --exclude-dir=.github \
               --exclude-dir=.backups --exclude-dir=node_modules 2>/dev/null; then
            echo "::error::Ha vuelto a aparecer el teléfono en el repositorio"
            exit 1
          fi

      # La CSP restringe script-src a 'self': un <script> con código inline
      # se bloquea en el navegador y el fallo solo se ve en producción.
      # ld+json es un bloque de datos, no ejecutable, y sí está permitido.
      # Solo -P: combinar -E y -P es un error de grep ("conflicting matchers"),
      # el comando salía con código 2, el `if` lo leía como "no hay
      # coincidencias" y la guarda llevaba desde que se escribió sin comprobar
      # absolutamente nada. Los lookaheads necesitan -P, así que se va -E.
      - name: Sin JavaScript inline (lo bloquea la CSP)
        run: |
          if grep -nP '<script(?![^>]*src=)(?![^>]*application/ld\+json)' \
                  src/*.html backend/app/static/*.html; then
            echo "::error::Script inline: la CSP script-src 'self' lo bloqueará (src/ y el panel del backend)"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HTML bien formado y JSON-LD válido
        run: |
          python3 - <<'PY'
          import json, re, pathlib, sys
          s = pathlib.Path("src/index.html").read_text(encoding="utf-8")
          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', s, re.S)
          if not m:
              sys.exit("::error::Falta el bloque schema.org")
          d = json.loads(m.group(1))          # lanza si el JSON es inválido
          assert d["@type"] == "ProfilePage", d["@type"]
          if "telephone" in m.group(1).lower():
              sys.exit("::error::El schema.org incluye teléfono")
          print("schema.org OK:", d["mainEntity"]["name"])
          PY

      - name: sitemap.xml válido
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('src/sitemap.xml')"

      # Un enlace de verificación roto es peor que no ofrecerlo: quien lo pulsa
      # pasa a dudar del certificado. Si data-verify tiene valor, tiene que ser
      # una URL https de verdad.
      - name: Certificaciones con código y verificación bien formada
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          html = pathlib.Path("src/index.html").read_text(encoding="utf-8")
          # <article> para las que abren el diploma en modal, <a> para las que
          # no tienen imagen y enlazan directamente a la verificación.
          tarjetas = re.findall(r'<(?:article|a) class="cert-card[^"]*"([^>]*)>', html)
          if not tarjetas:
              sys.exit("::error::No encuentro tarjetas de certificación")
          fallos = []
          for attrs in tarjetas:
              titulo = re.search(r'data-title="([^"]*)"', attrs)
              titulo = titulo.group(1) if titulo else "(sin título)"
              if not re.search(r'data-code="[0-9a-f-]{36}"', attrs):
                  fallos.append(f"{titulo}: falta data-code o no es un UUID")
              verify = re.search(r'data-verify="([^"]*)"', attrs)
              if verify is None:
                  fallos.append(f"{titulo}: falta data-verify")
              elif verify.group(1) and not verify.group(1).startswith("https://"):
                  fallos.append(f"{titulo}: data-verify no es una URL https")
          if fallos:
              sys.exit("::error::" + " · ".join(fallos))
          con_url = sum(1 for a in tarjetas if re.search(r'data-verify="https://', a))
          print(f"{len(tarjetas)} certificaciones · {con_url} con enlace de verificación")
          PY

      # src/en/index.html se genera desde src/index.html. Sin esta guarda, la
      # versión inglesa se queda atrás en la primera edición del CV y nadie se
      # entera, porque es la que uno no abre a diario.
      - name: La versión en inglés está al día
        run: python3 tools/generar-version-en.py --check

      # Los documentos ATS se generan desde tools/generar-cv-ats.py. Si el CV
      # cambia y estos no, se acaba enviando a un portal de empleo una versión
      # que ya no coincide con la web. Se compara word/document.xml y no el
      # fichero entero porque un ZIP guarda marcas de tiempo.
      - name: Los documentos ATS están al día
        run: |
          python3 tools/generar-cv-ats.py --check
          python3 tools/generar-cv-ats.py --en --check

      # La tarjeta de previsualización es lo único del sitio que un reclutador
      # ve sin visitarlo. Si la imagen desaparece o cambia de medidas, LinkedIn
      # deja de dibujar la tarjeta y no hay forma de enterarse desde aquí.
      - name: La imagen de Open Graph existe y está bien declarada
        run: python3 tools/generar-og.py --check

      - name: Las dos versiones tienen la misma estructura
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, re, sys

          # La tabla de identificadores se importa del generador para que exista
          # en un solo sitio: si allí se añade una sección, esto la sigue sola.
          spec = importlib.util.spec_from_file_location("gen", "tools/generar-version-en.py")
          gen = importlib.util.module_from_spec(spec); spec.loader.exec_module(gen)
          mapa = dict(gen.IDS_SECCION)

          def secciones(p):
              return re.findall(r'<section[^>]*id="([^"]+)"',
                                pathlib.Path(p).read_text(encoding="utf-8"))

          es, en = secciones("src/index.html"), secciones("src/en/index.html")
          esperado = [mapa.get(i, i) for i in es]
          if esperado != en:
              sys.exit(f"::error::Secciones distintas — esperaba {esperado}, hay {en}")

          # Toda ancla de la navegación tiene que apuntar a una sección real.
          for fichero in ("src/index.html", "src/en/index.html"):
              html = pathlib.Path(fichero).read_text(encoding="utf-8")
              ids = set(re.findall(r'\bid="([^"]+)"', html))
              rotas = [a for a in re.findall(r'href="#([^"]+)"', html) if a not in ids]
              if rotas:
                  sys.exit(f"::error::{fichero}: anclas sin destino {sorted(set(rotas))}")

          print("Estructura y anclas OK:", es, "->", en)
          PY

      # El presupuesto está documentado en CLAUDE.md pero nada lo comprobaba.
      # Mide lo que el navegador descarga al abrir la página: HTML, CSS y JS.
      # Quedan fuera assets/ (las imágenes de certificado solo se piden al
      # abrir el modal) y documentos/ (los CV descargables, que nadie pide
      # salvo que pulse). Incluirlos mediría algo que no es el peso de carga.
      - name: Presupuesto de peso de la página (< 200 KB)
        run: |
          KB=$(du -sb --exclude=assets --exclude=documentos src/ | awk '{print int($1/1024)}')
          echo "HTML + CSS + JS: ${KB} KB"
          [ "$KB" -lt 200 ] || { echo "::error::Presupuesto excedido: ${KB} KB"; exit 1; }

      # Los CV descargables sí conviene acotarlos: si algún día alguien mete
      # ahí un PDF con imágenes, engorda el repositorio sin que se note.
      - name: Los documentos descargables siguen siendo ligeros (< 500 KB)
        run: |
          KB=$(du -sb src/documentos | awk '{print int($1/1024)}')
          echo "src/documentos: ${KB} KB"
          [ "$KB" -lt 500 ] || { echo "::error::Documentos demasiado pesados: ${KB} KB"; exit 1; }

      # Al convertir los diplomas a WebP dejaron de casar con la regla de caché
      # de nginx, que listaba png pero no webp, y pasaron a servirse con
      # no-cache: se redescargaban en cada apertura del modal, anulando el
      # ahorro y sin dar ningún error. Esto vigila que no vuelva a pasar con
      # el siguiente formato que se añada.
      - name: Nginx cachea todas las extensiones que hay en src/assets
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          conf = pathlib.Path("nginx.conf").read_text(encoding="utf-8")
          m = re.search(r'location ~\* \\\.\(([^)]+)\)\$', conf)
          if not m:
              sys.exit("::error::No encuentro la regla de caché de assets en nginx.conf")
          cubiertas = set(m.group(1).split("|"))
          presentes = {p.suffix.lstrip(".").lower()
                       for p in pathlib.Path("src/assets").rglob("*") if p.is_file()}
          fuera = sorted(presentes - cubiertas)
          if fuera:
              sys.exit(f"::error::Extensiones en src/assets sin regla de caché: {fuera}. "
                       f"Añádelas al location ~* de nginx.conf")
          print("Extensiones cubiertas:", sorted(presentes))
          PY

      # Los diplomas no lastran la carga inicial —solo se piden al abrir el
      # modal— pero en PNG pesaban 2,1 MB y bastaba con arrastrar uno nuevo
      # sin convertir para volver ahí. El presupuesto lo impide.
      - name: Las imágenes siguen siendo ligeras (< 1 MB)
        run: |
          KB=$(du -sb src/assets/images | awk '{print int($1/1024)}')
          echo "src/assets/images: ${KB} KB"
          [ "$KB" -lt 1024 ] || {
            echo "::error::Imágenes demasiado pesadas: ${KB} KB. ¿Un PNG sin convertir a WebP?"
            exit 1; }

      - name: Toda imagen de src/assets está referenciada
        run: |
          fallo=0
          for f in src/assets/images/*; do
            n=$(basename "$f")
            grep -qF -- "$n" src/index.html src/en/index.html src/styles.css src/main.js || {
              echo "::warning::Imagen huérfana: $n"; fallo=1; }
          done
          exit $fallo

  frontend-e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json

      # El checklist manual de CLAUDE.md tenía seis puntos que nadie ejecutaba
      # en cada cambio. Esto los ejecuta: es lo único que comprueba que el
      # JavaScript haga en un navegador de verdad lo que dice hacer.
      #
      # Playwright vive en tools/e2e para que src/ siga sin dependencias.
      - name: Instalar Playwright
        working-directory: tools/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests de extremo a extremo
        working-directory: tools/e2e
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: tools/e2e/playwright-report/
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sintaxis y dependencias
        run: |
          python -m compileall -q backend/main.py backend/migrar_user_agents.py backend/app
          pip install -r backend/requirements-dev.txt

      # Clean code sin herramienta que lo vigile se erosiona: el criterio se
      # acaba discutiendo en cada revisión en lugar de estar escrito en
      # backend/ruff.toml. `make lint` ejecuta esto mismo en local.
      - name: Estilo (ruff)
        working-directory: backend
        run: |
          ruff check --output-format github .
          ruff format --check .

      # `print` no tiene nivel, ni marca de tiempo, ni se puede silenciar ni
      # subir a depuración. El servicio estuvo meses en bucle de reinicio con
      # el motivo escrito en un print, perdido entre el ruido de uvicorn.
      - name: El backend registra con logging, no con print
        run: |
          if grep -rn '^\s*print(' backend/app backend/main.py; then
            echo "::error::Usa el LOGGER de app/logs.py en lugar de print()"
            exit 1
          fi

      # Los tests no necesitan PostgreSQL: el pool se sustituye por un doble en
      # memoria (backend/tests/conftest.py). Una suite que exige levantar un
      # contenedor acaba sin ejecutarse, y una suite que no se ejecuta no
      # protege nada.
      - name: Tests
        working-directory: backend
        run: python -m pytest

      # Estas dos reglas están escritas en CLAUDE.md y son fáciles de romper.
      # Se recorren TODOS los módulos de rutas: una ruta nueva en un fichero
      # nuevo tiene que pasar por aquí igual. Cubre /api/analytics* y todo lo
      # que cuelga de /analytics, incluidos los ficheros estáticos del panel.
      - name: Toda ruta de datos de visitas exige autenticación
        run: |
          python3 - <<'PY'
          import ast, sys, pathlib
          PRIVADAS = ("/api/analytics", "/analytics")
          fallos, vistas = [], 0
          for fichero in sorted(pathlib.Path("backend/app/routes").glob("*.py")):
              arbol = ast.parse(fichero.read_text(encoding="utf-8"))
              for n in ast.walk(arbol):
                  if not isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  rutas = [d for d in n.decorator_list
                           if isinstance(d, ast.Call) and d.args
                           and isinstance(d.args[0], ast.Constant)
                           and str(d.args[0].value).startswith(PRIVADAS)]
                  if not rutas:
                      continue
                  vistas += 1
                  if "require_analytics_auth" not in ast.unparse(n.args):
                      fallos.append(f"{fichero.name}:{n.name}")
          if fallos:
              sys.exit(f"::error::Rutas sin Depends(require_analytics_auth): {fallos}")
          if vistas < 3:
              sys.exit(f"::error::Solo se han encontrado {vistas} rutas privadas; ¿ha cambiado el prefijo?")
          print(f"Matriz de autenticación OK ({vistas} rutas privadas)")
          PY

      - name: Ninguna IP se guarda en claro
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          # El esquema vive en las migraciones y el INSERT en el repositorio.
          # Se leen los dos: buscar solo en uno deja el invariante a medias.
          sql = "\n".join(f.read_text(encoding="utf-8")
                          for f in sorted(pathlib.Path("backend/migrations").glob("*.sql")))
          py = "\n".join(f.read_text(encoding="utf-8")
                         for f in sorted(pathlib.Path("backend/app").rglob("*.py")))

          # Buscar la palabra suelta "ip_address" no sirve: `ipaddress.ip_address()`
          # es la función de la biblioteca estándar que HACE la anonimización, y la
          # migración de instalaciones antiguas tiene que nombrar la columna vieja
          # para poder rellenar ip_prefix/ip_hash a partir de ella.
          # Los invariantes reales son estos tres:

          # 1. La tabla que se crea no declara la columna.
          m = re.search(r'CREATE TABLE IF NOT EXISTS cv_visits\s*\((.*?)\n\);', sql, re.S)
          if not m:
              sys.exit("::error::No encuentro el CREATE TABLE de cv_visits en backend/migrations/")
          if re.search(r'^\s*ip_address\b', m.group(1), re.M):
              sys.exit("::error::El CREATE TABLE vuelve a declarar ip_address")

          # 2. Ninguna migración posterior la vuelve a añadir.
          if re.search(r'ADD COLUMN (IF NOT EXISTS )?ip_address\b', sql):
              sys.exit("::error::Una migración añade la columna ip_address")

          # 3. Ningún INSERT del servicio escribe una IP completa.
          for ins in re.findall(r'INSERT INTO cv_visits(.*?)(?:"""|\'\'\')', py, re.S):
              if "ip_address" in ins:
                  sys.exit("::error::Un INSERT escribe ip_address")

          for f in ("ip_prefix", "ip_hash", "anonymize_ip"):
              assert f in py, f
          print("Anonimización presente; la columna en claro no se crea ni se escribe")
          PY

      - name: El directorio de migraciones entra en la imagen
        run: |
          grep -qE '^COPY +migrations/' backend/Dockerfile || {
            echo "::error::backend/Dockerfile no copia migrations/: el contenedor arrancaría sin esquema"
            exit 1; }
          test -n "$(ls backend/migrations/*.sql 2>/dev/null)" || {
            echo "::error::No hay migraciones en backend/migrations/"; exit 1; }
          echo "Migraciones: $(ls backend/migrations/ | tr '\n' ' ')"

      # Una migración ya aplicada no se edita: se añade otra. Editarla deja las
      # bases que ya la aplicaron con un esquema distinto del que dice tener, y
      # nada vuelve a mirarlo.
      - name: Las migraciones aplicadas no se reescriben
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
          tocadas=$(git diff --name-status "origin/${{ github.base_ref }}" -- backend/migrations/ \
                    | grep -vE '^A' || true)
          if [ -n "$tocadas" ]; then
            echo "::error::Se han modificado o borrado migraciones existentes:"
            echo "$tocadas"
            exit 1
          fi
          echo "Solo migraciones nuevas"

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # El stack local tiene que seguir levantándose en una máquina limpia: es
      # lo único que permite probar el proyecto entero sin las redes externas
      # ni la base de datos de otro proyecto.
      - name: El compose de desarrollo resuelve
        run: docker compose -f docker-compose.dev.yaml config > /dev/null

      # Las acciones van fijadas por SHA. Una etiqueta móvil como @v4 significa
      # que la CI ejecuta lo que haya en ella hoy, y quien controle esa etiqueta
      # controla un runner con acceso al repositorio. Dependabot las actualiza.
      - name: Ninguna acción con etiqueta móvil
        run: |
          if grep -rnE 'uses: +[^@]+@v[0-9]' .github/workflows/; then
            echo "::error::Fija la acción por SHA: uses: owner/repo@<sha> # vX.Y.Z"
            exit 1
          fi
          echo "Todas las acciones fijadas por SHA"

      - name: El compose resuelve con todas las variables
        env:
          DB_HOST: postgres-ci
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          ANALYTICS_USER: ci
          ANALYTICS_PASSWORD: ci
          ANALYTICS_IP_SALT: ci
        run: docker compose config > /dev/null

      # Falta una variable obligatoria: DEBE fallar. Si arranca con valores
      # por defecto es un fallo, no una comodidad: un DB_HOST con valor por
      # defecto dejó el servicio meses reiniciándose sin que nadie lo viera.
      - name: Falla rápido si falta un secreto
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          ANALYTICS_USER: ci
          ANALYTICS_PASSWORD: ci
          ANALYTICS_IP_SALT: ci
        run: |
          if docker compose config > /dev/null 2>&1; then
            echo "::error::El compose arrancó sin DB_HOST; debería haber fallado"
            exit 1
          fi
          echo "Falla rápido, como debe"

      # El panel de Traefik publica Host(devapis.cloud) && (PathPrefix(/api) ||
      # PathPrefix(/dashboard)) desde las etiquetas de su propio contenedor,
      # fuera de este repositorio. Traefik v2 deriva la prioridad de la
      # longitud de la regla, así que ese router vale 73 y se queda con todo
      # /api/* que no lo supere: eso tuvo el tracking de visitas roto durante
      # meses sin que se notara, porque el frontend se traga esos errores.
      #
      # No basta con comprobar los dos routers de hoy. Lo que hace falta es
      # que NINGUNA ruta futura bajo /api o /dashboard se despliegue sin
      # prioridad explícita, que es la forma en que volvería a pasar.
      - name: Toda ruta bajo /api declara prioridad por encima del panel
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, yaml

          PANEL = 73          # longitud de la regla del panel de Traefik
          RECLAMADOS = ("/api", "/dashboard")

          compose = yaml.safe_load(pathlib.Path("docker-compose.yaml").read_text(encoding="utf-8"))
          fallos, revisados = [], 0

          for servicio, cfg in compose.get("services", {}).items():
              etiquetas = cfg.get("labels") or []
              reglas, prioridades, middlewares = {}, {}, {}
              limitadores = set()
              for e in etiquetas:
                  if m := re.match(r"traefik\.http\.routers\.([^.]+)\.rule=(.*)", e, re.S):
                      reglas[m.group(1)] = m.group(2)
                  elif m := re.match(r"traefik\.http\.routers\.([^.]+)\.priority=(\d+)$", e):
                      prioridades[m.group(1)] = int(m.group(2))
                  elif m := re.match(r"traefik\.http\.routers\.([^.]+)\.middlewares=(.*)", e):
                      middlewares[m.group(1)] = m.group(2)
                  elif m := re.match(r"traefik\.http\.middlewares\.([^.]+)\.ratelimit\.", e):
                      limitadores.add(m.group(1))

              for router, regla in sorted(reglas.items()):
                  # Solo importan los routers que compiten con el panel: uno que
                  # sirva /cv no se cruza con él y no necesita prioridad.
                  rutas = re.findall(r"Path(?:Prefix)?\(`([^`]+)`\)", regla)
                  if not any(r == c or r.startswith(c + "/") for r in rutas for c in RECLAMADOS):
                      continue
                  revisados += 1
                  p = prioridades.get(router)
                  if p is None:
                      fallos.append(f"{servicio}/{router} sirve {rutas} y no declara priority; "
                                    f"caería en el panel de Traefik con 401 realm=\"traefik\"")
                  elif p <= PANEL:
                      fallos.append(f"{servicio}/{router} tiene priority {p}, "
                                    f"y el panel de Traefik vale {PANEL}")
                  else:
                      print(f"OK  {servicio}/{router}: priority {p} > {PANEL}  {rutas}")

                  # Todo lo que cuelga de /api es alcanzable desde internet sin
                  # pasar por nada más: el tracking porque es público por
                  # diseño, y las estadísticas porque HTTP Basic sin límite de
                  # intentos es fuerza bruta gratis.
                  usados = middlewares.get(router, "")
                  if not any(f"{m}@" in usados or usados == m
                             for m in limitadores) and "ratelimit" not in usados:
                      fallos.append(f"{servicio}/{router} sirve {rutas} sin rate limit; "
                                    f"middlewares declarados: {usados or 'ninguno'}")

          if not revisados:
              sys.exit("::error::Ningún router reclama /api ni /dashboard. "
                       "¿Se renombraron las rutas? Revisa esta guarda antes de darla por buena")
          if fallos:
              sys.exit("::error::" + " · ".join(fallos))
          print(f"{revisados} routers bajo {RECLAMADOS} con prioridad suficiente")
          PY

      - name: Construir la imagen del backend
        run: docker build -t cv-analytics:ci ./backend

      # Ningún contenedor corre como root. /api/track acepta escrituras
      # públicas: si algo escapa del proceso, que no tenga privilegios. Cada
      # pieza depende de la anterior: la imagen unprivileged obliga a escuchar
      # en 8080, y el compose tiene que apuntar a ese puerto.
      - name: Los contenedores no corren como root
        env:
          DB_HOST: postgres-ci
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          ANALYTICS_USER: ci
          ANALYTICS_PASSWORD: ci
          ANALYTICS_IP_SALT: ci
        run: |
          fallos=0
          grep -qE '^USER app' backend/Dockerfile || { echo "::error::backend/Dockerfile no declara USER app"; fallos=1; }
          grep -qE '^FROM nginxinc/nginx-unprivileged' Dockerfile || { echo "::error::El Dockerfile del frontend no usa nginx-unprivileged"; fallos=1; }
          grep -qE '^\s*listen 8080 ' nginx.conf || { echo "::error::nginx.conf debe escuchar en 8080: sin root no puede abrir el 80"; fallos=1; }
          grep -q 'loadbalancer.server.port=8080' docker-compose.yaml || { echo "::error::El compose sigue enviando el tráfico del CV al puerto 80"; fallos=1; }
          # Se lee el compose ya resuelto, no el YAML a mano, para que cuente lo
          # que Docker aplicará de verdad (incluye anclas y extensiones).
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          python3 - "$RUNNER_TEMP/compose.json" <<'PY' || fallos=1
          import json, sys
          servicios = json.load(open(sys.argv[1]))["services"]
          fallos = []
          for nombre in ("cv", "analytics-api"):
              s = servicios[nombre]
              if "no-new-privileges:true" not in s.get("security_opt", []):
                  fallos.append(f"{nombre}: falta security_opt no-new-privileges")
              if "ALL" not in s.get("cap_drop", []):
                  fallos.append(f"{nombre}: falta cap_drop ALL")
              if not s.get("read_only"):
                  fallos.append(f"{nombre}: el sistema de ficheros no es read_only")
          if fallos:
              sys.exit("::error::" + " · ".join(fallos))
          print("Endurecimiento presente en cv y analytics-api")
          PY
          exit $fallos

      # Nginx no acumula add_header entre niveles: un location con su propio
      # Cache-Control pierde la CSP y el HSTS del bloque server. Así estuvo el
      # sitio en producción, sin ninguna cabecera de seguridad en ninguna
      # respuesta, y no hay forma de verlo sin arrancar Nginx. Por eso esto
      # construye la imagen real y la interroga.
      - name: Nginx envía las cabeceras de seguridad en todas las respuestas
        run: |
          docker build -q -t landpage:ci . > /dev/null
          docker run -d --rm --name landpage-ci -p 8080:8080 \
            --read-only --tmpfs /tmp --tmpfs /var/cache/nginx \
            --cap-drop ALL --security-opt no-new-privileges:true landpage:ci > /dev/null
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ > /dev/null && break; sleep 1; done
          fallos=0
          for ruta in / /en/ /styles.css /main.js /theme-init.js /assets/images/Django.webp /no-existe; do
            cab=$(curl -s -D - -o /dev/null "http://localhost:8080$ruta")
            for h in content-security-policy strict-transport-security x-content-type-options x-frame-options; do
              echo "$cab" | grep -qi "^$h:" || { echo "::error::$ruta sin cabecera $h"; fallos=1; }
            done
            n=$(echo "$cab" | grep -ci '^cache-control:')
            [ "$n" -eq 1 ] || { echo "::error::$ruta lleva $n cabeceras Cache-Control (debe ser 1)"; fallos=1; }
          done

          # Una ruta que no existe tiene que decirlo. Devolver 200 con el CV es
          # un soft 404: el buscador indexa una página que afirma existir.
          for ruta in / /en/ /main.js; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$ruta")
            [ "$codigo" = 200 ] || { echo "::error::$ruta devolvió $codigo"; fallos=1; }
          done
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-existe)
          [ "$codigo" = 404 ] || { echo "::error::Una ruta inexistente devolvió $codigo en lugar de 404"; fallos=1; }
          curl -s http://localhost:8080/no-existe | grep -q '404' \
            || { echo "::error::La página 404 no se está sirviendo"; fallos=1; }
          curl -s http://localhost:8080/no-existe | grep -qi 'Senior Backend Developer' \
            && { echo "::error::La ruta inexistente devuelve el CV entero"; fallos=1; }
          [ "$(docker exec landpage-ci id -u)" != "0" ] || { echo "::error::Nginx corre como root"; fallos=1; }
          # emerg/crit/alert y no error: un 403 por la regla de .git también se
          # registra como [error] y no es un fallo de arranque.
          docker logs landpage-ci 2>&1 | grep -iE '\[(emerg|crit|alert)\]' && { echo "::error::Errores en el arranque de Nginx"; fallos=1; }
          docker stop landpage-ci > /dev/null
          exit $fallos
