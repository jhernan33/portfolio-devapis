<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>Página no encontrada · José Hernán Varela</title>
	<!--
		Página propia y no el CV entero.

		Antes cualquier ruta inexistente devolvía 200 con el índice: para un
		buscador eso es un "soft 404", una página que dice existir y no
		existe, y ensucia justo el sitio que sí cuida su SEO. Este fichero
		responde con un 404 de verdad.

		Los estilos van aquí dentro a propósito. Son veinte líneas, evitan una
		segunda petición en una página que casi nadie ve, y la CSP permite
		estilos en línea (style-src 'unsafe-inline') aunque no scripts.
	-->
	<style>
		:root { color-scheme: light dark; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
			background: #f8fafc;
			color: #0f172a;
			text-align: center;
			padding: 1.5rem;
		}
		main { max-width: 32rem; }
		.codigo { font-size: 4rem; font-weight: 700; color: #0369a1; margin: 0; line-height: 1; }
		h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
		p { color: #475569; line-height: 1.6; margin: 0 0 1.75rem; }
		a {
			display: inline-block;
			padding: 0.7rem 1.4rem;
			border-radius: 0.5rem;
			background: #0369a1;
			color: #fff;
			text-decoration: none;
			font-weight: 600;
		}
		a:hover, a:focus-visible { background: #075985; }
		@media (prefers-color-scheme: dark) {
			body { background: #0f172a; color: #f1f5f9; }
			p { color: #94a3b8; }
			.codigo, a { background: none; color: #38bdf8; }
			a { background: #0ea5e9; color: #0f172a; }
		}
	</style>
</head>
<body>
	<main>
		<p class="codigo">404</p>
		<h1>Esta página no existe</h1>
		<p>
			Puede que el enlace esté mal escrito o que la página se haya movido.
			<span lang="en">This page does not exist.</span>
		</p>
		<a href="/cv/">Ir al CV</a>
	</main>
</body>
</html>
