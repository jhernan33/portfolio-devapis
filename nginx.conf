# Configuración de Nginx para Landing Page estática
# Compatible con: Docker, Docker Compose y Traefik
# Nota: Traefik maneja TLS/HTTPS (puerto 443)
#       Nginx escucha en 8080 (tráfico interno). Es un puerto no privilegiado
#       a propósito: la imagen es nginx-unprivileged y el proceso no es root,
#       así que no puede abrir el 80. Si vuelve a ponerse 80, el contenedor
#       muere al arrancar con "permission denied".

server {
    # Puerto de escucha (Traefik redirige el tráfico HTTPS aquí)
    listen 8080 default_server;
    listen [::]:8080 default_server;

    # Server name (Traefik reescribe esto)
    server_name _;

    # Root y index
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # SEGURIDAD
    # ============================================

    # Ocultar versión de Nginx
    server_tokens off;

    # Charset UTF-8 por defecto
    charset utf-8;

    # Cabeceras de seguridad (CSP, HSTS, X-Frame-Options...). Viven en un
    # snippet porque hay que repetir el include en cada `location` que declare
    # su propio add_header: si no, ese location pierde TODAS las heredadas.
    # Así estuvo el sitio en producción, sin CSP ni HSTS en ninguna respuesta.
    include /etc/nginx/snippets/security-headers.conf;

    # ============================================
    # ROUTING Y REESCRITURA
    # ============================================

    # Este Nginx vive detrás de Traefik, que elimina el prefijo /cv antes de
    # que la petición llegue aquí. Nginx no sabe que ese prefijo existe, así
    # que cualquier redirección que construya sale mal por partida doble:
    # pierde el /cv y degrada a http, porque el TLS también termina en el
    # proxy. Con absolute_redirect off emite Location relativas y el navegador
    # las resuelve contra la URL que sí conoce.
    absolute_redirect off;
    port_in_redirect off;

    # La redirección automática de directorio seguiría perdiendo el prefijo:
    # /cv/en generaba Location /en/ y de ahí un 404. Verificado en producción
    # antes de este arreglo — y era justo la URL canónica de la versión en
    # inglés, así que un rastreador la habría dado por inexistente.
    location = /en {
        return 301 /cv/en/;
    }

    location / {
        # 404 de verdad, no el índice.
        #
        # Antes esto era `try_files $uri $uri/ /index.html` con un
        # `error_page 404 =200 /index.html` detrás: cualquier ruta inexistente
        # devolvía 200 con el CV completo. Para un buscador eso es un soft 404,
        # una página que afirma existir sin existir, y este sitio tiene sitemap
        # y canonical: le importa lo que indexe.
        #
        # No hace falta el reenvío de una SPA porque esto no es una SPA: no hay
        # rutas de cliente, solo dos documentos y sus anclas.
        try_files $uri $uri/ =404;

        # Sin caché: el HTML tiene que estar siempre fresco. Se escribe la
        # cabecera una sola vez; `expires` añadía un segundo Cache-Control.
        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Explícitamente servir index.html como archivo
    location = /index.html {
        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ============================================
    # CACHÉ AGRESIVO PARA ASSETS ESTÁTICOS
    # ============================================

    # webp y avif están en la lista aunque hoy solo se use webp: al pasar los
    # diplomas de PNG a WebP, esta regla dejó de casar con ellos y se cayeron
    # al no-cache de index.html. Se volvían a descargar en cada apertura del
    # modal, que es justo lo contrario de lo que buscaba la conversión, y sin
    # dar ningún error. La guarda de CI comprueba que ninguna extensión de
    # src/assets se quede fuera de aquí.
    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf)$ {
        # Caché por 1 año (immutable = nunca cambiarán). Una sola cabecera:
        # con `expires 1y` más este add_header salían dos Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;

        # Desactivar etag para contenido inmutable
        etag off;

        # Acceso log reducido para assets
        access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    }

    # Directorio .git no debe ser accesible
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Archivos ocultos (.htaccess, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # COMPRESIÓN
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/x-component
        text/x-cross-domain-policy;

    gzip_disable "msie6";

    # ============================================
    # ERRORES CUSTOMIZADOS
    # ============================================

    error_page 404 /404.html;
    location = /404.html {
        internal;
        # Sin caché: si mañana esa ruta existe, el navegador no debe seguir
        # enseñando el error guardado.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Errores del servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}