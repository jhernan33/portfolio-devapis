# Cabeceras de seguridad del CV.
#
# Van en un fichero aparte porque Nginx NO acumula `add_header` entre niveles:
# en cuanto un `location` declara uno propio (por ejemplo Cache-Control), deja
# de heredar TODOS los del bloque `server`. Con las cabeceras escritas solo en
# `server`, ninguna respuesta las llevaba —ni la CSP ni HSTS— y nadie lo notó
# porque el sitio funciona exactamente igual sin ellas.
#
# Por eso este fichero se incluye en el bloque `server` Y en cada `location`
# que añada alguna cabecera. La CI arranca la imagen y comprueba que lleguen.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection se ha quitado a propósito. Los navegadores actuales la
# ignoran, y en los que la implementaron el filtro llegó a introducir
# vulnerabilidades propias: por eso Chrome lo retiró. Lo que protege de
# verdad aquí es la Content-Security-Policy de abajo.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content Security Policy. script-src 'self' obliga a que todo el JavaScript
# viva en main.js: un <script> inline queda bloqueado por el navegador.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;

# HSTS: Traefik termina el TLS; aquí solo se informa al navegador.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
